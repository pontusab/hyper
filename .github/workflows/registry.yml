name: registry

# Validates the registry graph + the website that hosts it. Vercel handles
# the actual deploy via the GitHub integration on push to `main`, so this
# workflow only gates: the manifest graph stays closed, the website's
# registry routes still pass their tests, and `next build` succeeds.

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "apps/website/**"
      - "tools/**"
      - ".github/workflows/registry.yml"
  pull_request:
    paths:
      - "packages/**"
      - "apps/website/**"
      - "tools/**"
  workflow_dispatch:

concurrency:
  group: registry-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.11

jobs:
  validate:
    name: validate registry graph + website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: registry sanity check
        run: bun run registry:check
      - name: website registry tests
        run: bun test --cwd apps/website
      - name: next build (production)
        run: bun run build
        working-directory: apps/website
